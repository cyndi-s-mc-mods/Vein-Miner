name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.0.0). Leave empty to just build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # TEMPORARY: list NeoForge's block break event classes if the build fails.
      - name: Find NeoForge break events
        if: failure()
        run: |
          for j in $(find ~/.gradle neoforge/build -name '*.jar' 2>/dev/null | grep -i neoforge); do
            unzip -l "$j" 2>/dev/null | grep -oE 'net/neoforged/neoforge/event/[A-Za-z/]*Break[A-Za-z$]*\.class' | sed "s|^|$(basename $j): |"
          done | sort -u | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: vein-miner
          path: '*/build/libs/*.jar'

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vein-miner

      - name: Drop sources jars
        run: find . -name '*-sources.jar' -delete

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Vein Miner ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: '**/*.jar'
